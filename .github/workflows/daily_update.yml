name: Daily STARLUX Intelligence Update

on:
  # 1. 每日定時排程：UTC 時間 00:00 (對應台灣時間每天早上 08:00)
  schedule:
    - cron: '0 0 * * *'
  
  # 2. 支援手動點擊按鈕立即執行 (並提供「是否強制執行每月1號基本盤對帳」的開關)
  workflow_dispatch:
    inputs:
      force_audit:
        description: '是否強制執行「每月 1 號 Google 搜尋基本盤對帳」？(true / false)'
        required: false
        default: 'false'

# 授權給 GitHub Actions 機器人「寫入檔案」的權限，讓它能自動儲存更新後的 JSON
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 步驟 1：把你的專案檔案下載到雲端虛擬電腦
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 步驟 2：在雲端電腦安裝 Python 3.11
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 步驟 3：照著 requirements.txt 安裝套件
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步驟 4：帶入你的金鑰並執行 Python 情報抓取與 AI 分析腳本
      - name: 🤖 Run Fetch and Summarize Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MONTHLY_AUDIT: ${{ github.event.inputs.force_audit || 'false' }}
        run: |
          python scripts/fetch_and_summarize.py

      # 步驟 5：把更新後的 data.json 與 history.json 自動存檔推回 GitHub
      - name: 💾 Commit and Push updated JSON files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json history.json
          git diff --staged --quiet || (git commit -m "chore: 自動更新航空情報與歷史回溯 ($(date +'%Y-%m-%d'))" && git push)
